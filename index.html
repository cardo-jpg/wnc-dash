    // LP: Malu (malu-ads-c) = campanhas [MALU]; Hire (hire-ads-c) = [HIRE]. Funil por LP (estilo WICI2).
    function lpAgg(rows, vdOverride){
      let cost=0,imp=0,clk=0,pv=0,ic=0,vd=0;
      for(const r of rows){ cost+=r.cost;imp+=r.impressions;clk+=r.clicks;pv+=r.pageview;ic+=r.ic;vd+=r.compras; }
      if(vdOverride!=null) vd=vdOverride;            // vendas por página (regra da LP)
      else { const t=viewTarget(rows); if(t!=null) vd=t; }   // total: planilha
      return { investido:cost, imp, cliques:clk, pv, ic, vendas:vd, ctr:div(clk,imp)*100, connect:connectAgg(rows),
        tx_checkout:div(ic,pv)*100, tx_venda:div(vd,ic)*100, conv:div(vd,clk)*100, cpa:div(cost,vd) };
    }
    // Vendas por página. Base = POPUPS de ads por página (colunas da planilha
    // MÉTRICAS), que é a distribuição real. A página C de cada perfil absorve a
    // diferença até o total do perfil (planilha). A Malu A não tem coluna de popup
    // → o peso dela vem direto da fonte de dados (compras do Meta).
    function pageVendas(lps){
      // Vendas ADS por página. Peso = popup da página (colunas MÉTRICAS). Distribui o
      // total do perfil (planilha) pelos pesos; páginas sem popup (ex.: 9,90, direto
      // pro checkout) caem pro nº de compras do Meta. Soma = total da planilha.
      const out={};
      const W={ 'LP Malu A':cumInRange('pMaluA'), 'LP Malu B':cumInRange('pMaluB'), 'LP Malu C':cumInRange('pMaluC'),
                'LP Hire A':cumInRange('pHireA') };
      for(const perfil of ['Malu','Hire']){
        const pref='LP '+perfil+' ';
        const pages=lps.filter(l=>l.nome.indexOf(pref)===0);
        if(!pages.length) continue;
        const prows=(perfil==='Malu'?DATA.malu:DATA.hire).filter(r=>inRange(r.date));
        const target=viewTarget(prows);
        if(target==null){ for(const lp of pages) out[lp.nome]=lp.rows.reduce((s,r)=>s+r.compras,0); continue; }
        const raw=pages.map(lp=>(W[lp.nome]!=null?W[lp.nome]:0));
        const base = raw.some(v=>v>0) ? raw : pages.map(lp=>lp.rows.reduce((s,r)=>s+r.compras,0));
        const dist=distribute(base, Math.round(target));
        pages.forEach((lp,i)=>out[lp.nome]=dist[i]);
      }
      return out;
    }
    function lpDaily(rows){
      const map={}, adsD=adsByDay(rows);
      for(const r of rows){ const k=dkey(r.date); const o=map[k]||(map[k]={clk:0,pv:0,ic:0,vd:0,imp:0}); o.clk+=r.clicks;o.pv+=r.pageview;o.ic+=r.ic;o.imp+=r.impressions; }
      for(const k in map) map[k].vd = adsD[k]||0;   // vendas/dia da planilha
      const keys=Object.keys(map).sort();
      return { labels:keys.map(k=>{const p=k.split('-');return p[2]+'/'+p[1];}),
        connect:keys.map(k=>{const o=map[k];return (o.clk&&o.pv>0)?+(o.pv/o.clk*100).toFixed(2):null;}),
        checkout:keys.map(k=>{const o=map[k];return o.pv?+(o.ic/o.pv*100).toFixed(2):null;}),
        txconv:keys.map(k=>{const o=map[k];return o.ic?+(o.vd/o.ic*100).toFixed(2):null;}),
        txconvpv:keys.map(k=>{const o=map[k];return o.pv?+(o.vd/o.pv*100).toFixed(2):null;}) };
    }
    function lpLine(cid, labels, data, color){
      const el=document.getElementById(cid); if(!el) return;
      charts.push(new Chart(el,{ type:'line',
        data:{ labels, datasets:[{ data, borderColor:color, backgroundColor:color+'22', borderWidth:2, pointRadius:2, pointBackgroundColor:color, tension:.3, spanGaps:true, fill:true }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+PCT(c.parsed.y)}}},
          scales:{ x:{grid:{color:'#ffffff08'},ticks:{color:'#9a8bb0',font:{size:9},maxTicksLimit:8}}, y:{grid:{color:'#ffffff08'},ticks:{color:'#9a8bb0',font:{size:9},callback:v=>Math.round(v)+'%'},beginAtZero:true} } }
      }));
    }
    function renderLP(){
      killCharts();
      // Uma LP por PÁGINA (não por perfil): a página vem do sufixo da campanha.
      // Só entra página que teve investimento no período — senão a tela enche de
      // funil vazio de página que ainda não subiu campanha.
      const _byPage={};
      for(const [perfil,src] of [['Malu',DATA.malu],['Hire',DATA.hire]]){
        for(const r of src){ if(!inRange(r.date)) continue;
          const pg=campPage(r.campanha), k=perfil+'|'+pg;
          (_byPage[k]=_byPage[k]||{nome:'LP '+perfil+' '+pg, url:lpUrl(perfil,pg), rows:[]}).rows.push(r);
        }
      }
      const lps=Object.keys(_byPage).sort()
        .map(k=>_byPage[k])
        .filter(l=>l.rows.some(r=>r.cost>0));
      if(!lps.length){ document.getElementById('body').innerHTML='<div class="empty">Sem dados no período</div>';
        document.getElementById('updated').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); return; }
      // Soma TODAS as páginas. Era lps[0]+lps[1] fixo (de quando só existiam Malu
      // e Hire) — com 3+ páginas isso silenciosamente deixava as demais de fora.
      const _allRows=lps.reduce((a,l)=>a.concat(l.rows),[]);
      const vendMap=pageVendas(lps);                              // venda por página
      const g=lpAgg(_allRows);
      g.vendas=Object.values(vendMap).reduce((a,b)=>a+b,0);       // GERAL = soma dos painéis
      g.cpa=div(g.investido,g.vendas);
      const _lbl='GERAL ('+lps.map(l=>l.nome.replace('LP ','')).join(' + ')+')';
      let h=`<div class="lp-geral"><div class="lp-geral-lbl">${_lbl}</div><div class="lp-geral-stats">
        <div><div class="lp-meta-lbl">Total Gasto</div><div class="lp-meta-val">${BRL(g.investido)}</div></div>
        <div><div class="lp-meta-lbl">CPA Médio</div><div class="lp-meta-val">${g.vendas>0?BRL(g.cpa):'—'}</div></div>
        <div><div class="lp-meta-lbl">Tx Conv PV→V</div><div class="lp-meta-val accent">${PCT(div(g.vendas,g.pv)*100)}</div></div>
        <div><div class="lp-meta-lbl">Total Vendas</div><div class="lp-meta-val">${NUM(g.vendas)}</div></div>
      </div></div><div class="lp-grid">`;
      const jobs=[];
      lps.forEach((lp,i)=>{ const a=lpAgg(lp.rows, vendMap[lp.nome]), d=lpDaily(lp.rows);
        const steps=[
          {n:'IMPRESSÕES', v:a.imp, wt:100, wb:86, rate:'CTR '+PCT(a.ctr)},
          {n:'CLIQUES NO LINK', v:a.cliques, wt:80, wb:66, rate:'CONNECT '+PCT(a.connect)},
          {n:'PAGE VIEW', v:a.pv, wt:60, wb:46, rate:'CHECKOUT '+PCT(a.tx_checkout)},
          {n:'CHECKOUT', v:a.ic, wt:40, wb:30, rate:'TX CONV '+PCT(a.tx_venda)},
          {n:'VENDAS ADS', v:a.vendas, wt:26, wb:20, rate:''},
        ];
        let fn='<div class="fn">';
        for(let si=0;si<steps.length;si++){ const s=steps[si]; const tl=(100-s.wt)/2,tr=(100+s.wt)/2,br=(100+s.wb)/2,bl=(100-s.wb)/2; const L=34+si*8;
          fn+=`<div class="fn-seg" style="clip-path:polygon(${tl}% 0,${tr}% 0,${br}% 100%,${bl}% 100%);background:linear-gradient(180deg,hsla(285,52%,${L}%,.92),hsla(285,52%,${L-7}%,.86))"><div class="fn-lbl">${s.n}</div><div class="fn-val">${NUM(s.v)}</div></div>`;
          if(s.rate) fn+=`<div class="fn-rate"><span class="fn-pill">${s.rate}</span></div>`;
        }
        fn+='</div>';
        h+=`<div class="lp-panel"><div class="lp-header"><div class="lp-header-left"><div class="lp-header-name">${lp.nome}</div><a class="lp-header-url" href="${lp.url}" target="_blank">${lp.url.replace('https://','')}</a></div>
          <div class="lp-header-right">
            <div><div class="lp-meta-lbl">Total Gasto</div><div class="lp-meta-val">${BRL(a.investido)}</div></div>
            <div><div class="lp-meta-lbl">CPA</div><div class="lp-meta-val">${a.vendas>0?BRL(a.cpa):'—'}</div></div>
            <div><div class="lp-meta-lbl">Tx Conv PV→V</div><div class="lp-meta-val accent">${PCT(div(a.vendas,a.pv)*100)}</div></div>
          </div></div>
          <div class="lp-body"><div class="lp-funnel-col">${fn}</div><div class="lp-charts-col">
            <div class="lp-chart-card"><div class="lp-chart-title">Connect Rate</div><div class="lp-chart-h"><canvas id="lpA${i}"></canvas></div></div>
            <div class="lp-chart-card"><div class="lp-chart-title">Checkout Rate (PV→Checkout)</div><div class="lp-chart-h"><canvas id="lpB${i}"></canvas></div></div>
            <div class="lp-chart-card"><div class="lp-chart-title">Taxa Conversão (Checkout→Vendas)</div><div class="lp-chart-h"><canvas id="lpC${i}"></canvas></div></div>
            <div class="lp-chart-card"><div class="lp-chart-title">Taxa Conversão (PV→Vendas)</div><div class="lp-chart-h"><canvas id="lpD${i}"></canvas></div></div>
          </div></div></div>`;
        jobs.push({i,d});
      });
      h+=`</div>`;
      document.getElementById('body').innerHTML=h;
      jobs.forEach(({i,d})=>{ lpLine('lpA'+i,d.labels,d.connect,'#c07be0'); lpLine('lpB'+i,d.labels,d.checkout,'#e0a75e'); lpLine('lpC'+i,d.labels,d.txconv,'#a855c8'); lpLine('lpD'+i,d.labels,d.txconvpv,'#8b7bef'); });
      document.getElementById('updated').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }

    // ── VENDAS (Mentoria Malu) — funil de e-commerce ────────────────────────────
    function vAgg(rows){
      const a={inv:0,imp:0,clk:0,vis:0,cart:0,valcart:0,chk:0,vendas:0,fat:0};
      for(const r of rows){ a.inv+=r.inv;a.imp+=r.imp;a.clk+=r.clk;a.vis+=r.vis;a.cart+=r.cart;a.valcart+=r.valcart;a.chk+=r.chk;a.vendas+=r.vendas;a.fat+=r.fat; }
      a.ctr=div(a.clk,a.imp)*100;
      a.cpa=div(a.inv,a.vendas);
      a.roas=div(a.fat,a.inv);
      a.ticket=div(a.fat,a.vendas);
      a.cpv=div(a.inv,a.vis);              // custo por visita ao site
      a.txvenda=div(a.vendas,a.chk)*100;   // checkout → venda
      return a;
    }
    function setVendasGroup(el){ document.querySelectorAll('.vgbtn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); vendasGroup=el.dataset.g; renderVendas(); }
    function renderVendas(){
      killCharts();
      const upd=()=>{ const u=document.getElementById('updated'); if(u) u.textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
      // A aba Vendas NÃO esconde o dia atual: gasto E venda vêm na MESMA linha da
      // planilha "Vendas" (sem o lag que estoura o CPA nas abas do workshop, onde a
      // venda é lançada depois na MÉTRICAS). Por isso não aplica o teto d>ontem().
      const inRangeV = d => (!fStart||d>=fStart) && (!fEnd||d<=fEnd) && d>=cutoff();
      const rows=(DATA.vendas||[]).filter(r=>inRangeV(r.date));
      if(!rows.length){ document.getElementById('body').innerHTML='<div class="empty">Sem dados de vendas no período</div>'; upd(); return; }
      const g=vAgg(rows);
      const cot=(DATA.metas&&DATA.metas.cotacao)||5.19;   // Investimento vem em US$ (conta Meta)
      const camps=[...new Set(rows.map(r=>r.campanha))].filter(x=>x&&x!=='—');
      // Funil
      const steps=[
        {n:'IMPRESSÕES',          v:g.imp,    wt:100, wb:84, rate:'CTR '+PCT(g.ctr)},
        {n:'CLIQUES NO LINK',     v:g.clk,    wt:84,  wb:66, rate:'VISITA '+PCT(div(g.vis,g.clk)*100)},
        {n:'VISITAS NO SITE',     v:g.vis,    wt:64,  wb:50, rate:'ADD CARRINHO '+PCT(div(g.cart,g.vis)*100)},
        {n:'ADIÇÕES AO CARRINHO', v:g.cart,   wt:48,  wb:36, rate:'CHECKOUT '+PCT(div(g.chk,g.cart)*100)},
        {n:'CHECKOUT',            v:g.chk,    wt:34,  wb:24, rate:'TX CONVERSÃO '+PCT(g.txvenda)},
        {n:'VENDAS',              v:g.vendas, wt:22,  wb:16, rate:''},
      ];
      let fn='<div class="fn">';
      for(let si=0;si<steps.length;si++){ const s=steps[si]; const tl=(100-s.wt)/2,tr=(100+s.wt)/2,br=(100+s.wb)/2,bl=(100-s.wb)/2; const L=34+si*7;
        fn+=`<div class="fn-seg" style="clip-path:polygon(${tl}% 0,${tr}% 0,${br}% 100%,${bl}% 100%);background:linear-gradient(180deg,hsla(285,52%,${L}%,.92),hsla(285,52%,${L-7}%,.86))"><div class="fn-lbl">${s.n}</div><div class="fn-val">${NUM(s.v)}</div></div>`;
        if(s.rate) fn+=`<div class="fn-rate"><span class="fn-pill">${s.rate}</span></div>`;
      }
      fn+='</div>';
      // Header GERAL (KPIs de dinheiro)
      let h=`<div class="lp-geral"><div class="lp-geral-lbl">MENTORIA MALU · Vendas${camps.length?' ('+camps.length+' camp.)':''}<div style="font-size:.62rem;font-weight:600;opacity:.85;margin-top:3px;letter-spacing:.02em">Investido convertido US$ → R$ (× ${cot.toLocaleString('pt-BR',{minimumFractionDigits:2})}) · Faturamento já em R$</div></div><div class="lp-geral-stats">
        <div><div class="lp-meta-lbl">Investido</div><div class="lp-meta-val">${BRL(g.inv)}</div></div>
        <div><div class="lp-meta-lbl">Vendas</div><div class="lp-meta-val">${NUM(g.vendas)}</div></div>
        <div><div class="lp-meta-lbl">Faturamento</div><div class="lp-meta-val">${g.vendas>0?BRL(g.fat):'—'}</div></div>
        <div><div class="lp-meta-lbl">CPA</div><div class="lp-meta-val">${g.vendas>0?BRL(g.cpa):'—'}</div></div>
        <div><div class="lp-meta-lbl">ROAS</div><div class="lp-meta-val accent">${g.vendas>0?RS(g.roas):'—'}</div></div>
        <div><div class="lp-meta-lbl">Ticket Médio</div><div class="lp-meta-val">${g.vendas>0?BRL(g.ticket):'—'}</div></div>
      </div></div>`;
      // Painel do funil
      h+=`<div class="lp-panel"><div class="lp-header"><div class="lp-header-left"><div class="lp-header-name">Funil de Vendas — Mentoria Malu</div></div>
        <div class="lp-header-right"><div><div class="lp-meta-lbl">Custo por visita</div><div class="lp-meta-val">${g.vis?BRL(g.cpv):'—'}</div></div></div></div>
        <div style="max-width:540px;margin:8px auto 0">${fn}</div></div>`;
      // Tabela por grupo (Criativo / Campanha / Público)
      const keyf = vendasGroup==='campanha'? r=>r.campanha : vendasGroup==='publico'? r=>r.publico : r=>r.criativo;
      const glabel = vendasGroup==='campanha'?'Campanha':vendasGroup==='publico'?'Público':'Criativo';
      const by={};
      for(const r of rows){ const k=keyf(r)||'—'; const o=by[k]||(by[k]={k, link:'', _rows:[]}); if(!o.link&&r.link)o.link=r.link; o._rows.push(r); }
      let list=Object.values(by).map(o=>Object.assign({k:o.k, link:o.link}, vAgg(o._rows)));
      list=sortRows('vendas', list, 'inv');
      const gb=(gg,lbl)=>`<button class="vgbtn${vendasGroup===gg?' active':''}" data-g="${gg}" onclick="setVendasGroup(this)">${lbl}</button>`;
      h+=`<div class="lbl">Detalhe por ${glabel} (${list.length})</div>
        <div class="vgsel">${gb('criativo','Criativo')}${gb('campanha','Campanha')}${gb('publico','Público')}</div>
        <div class="twrap"><table><thead><tr>
        ${sortTh('vendas','k',glabel,1)}<th>Status</th>${sortTh('vendas','inv','Investido')}${sortTh('vendas','imp','Impr.')}${sortTh('vendas','ctr','CTR')}${sortTh('vendas','clk','Cliques')}${sortTh('vendas','vis','Visitas')}${sortTh('vendas','cart','Add Cart')}${sortTh('vendas','chk','Checkout')}${sortTh('vendas','vendas','Vendas')}${sortTh('vendas','cpa','CPA')}${sortTh('vendas','fat','Fat.')}${sortTh('vendas','roas','ROAS')}<th>Link</th>
      </tr></thead><tbody>`;
      const vtype='v'+vendasGroup;   // namespace de status próprio da aba Vendas (não colide c/ workshop)
      for(const o of list){
        h+=`<tr><td title="${o.k}">${o.k}</td><td>${stBadgeClk(vtype,o.k,'ACTIVE')}</td><td>${BRL(o.inv)}</td><td>${NUM(o.imp)}</td><td>${PCT(o.ctr)}</td><td>${NUM(o.clk)}</td><td>${NUM(o.vis)}</td><td>${NUM(o.cart)}</td><td>${NUM(o.chk)}</td><td>${NUM(o.vendas)}</td><td>${o.vendas>0?BRL(o.cpa):'—'}</td><td>${o.vendas>0?BRL(o.fat):'—'}</td><td>${o.vendas>0?RS(o.roas):'—'}</td><td>${o.link?`<a class="vlink" href="${o.link}" target="_blank">abrir</a>`:'—'}</td></tr>`;
      }
      h+=`</tbody></table></div>`;
      document.getElementById('body').innerHTML=h;
      upd();
    }

    // ── Aba WHATS: campanhas de mentoria por WhatsApp (já estão na Malu/Hire Meta) ──
    function renderWhats(){
      killCharts();
      const upd=()=>{ const u=document.getElementById('updated'); if(u) u.textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
      const inRangeW = d => (!fStart||d>=fStart) && (!fEnd||d<=fEnd) && d>=cutoff();
      const rows=DATA.malu.concat(DATA.hire).filter(r=>inRangeW(r.date) && /WHATSAPP/i.test(r.campanha||''));
      if(!rows.length){ document.getElementById('body').innerHTML='<div class="empty">Sem dados de WhatsApp no período</div>'; upd(); return; }
      const S=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
      const inv=S('cost'), imp=S('impressions'), reach=S('reach'), clk=S('clicks');
      const ctr=div(clk,imp)*100, cpm=div(inv,imp)*1000, cpc=div(inv,clk);
      const camps=[...new Set(rows.map(r=>r.campanha))].filter(x=>x&&x!=='—');
      let h=`<div class="lp-geral"><div class="lp-geral-lbl">MENTORIA · WHATSAPP${camps.length?' ('+camps.length+' camp.)':''}<div style="font-size:.62rem;font-weight:600;opacity:.85;margin-top:3px;letter-spacing:.02em">Mentoria vendida por WhatsApp · investido já em R$ · a venda fecha no Clint (não é rastreada por campanha, por isso sem CPA/ROAS aqui)</div></div><div class="lp-geral-stats">
        <div><div class="lp-meta-lbl">Investido</div><div class="lp-meta-val">${BRL(inv)}</div></div>
        <div><div class="lp-meta-lbl">Impressões</div><div class="lp-meta-val">${NUM(imp)}</div></div>
        <div><div class="lp-meta-lbl">Alcance</div><div class="lp-meta-val">${NUM(reach)}</div></div>
        <div><div class="lp-meta-lbl">Cliques</div><div class="lp-meta-val">${NUM(clk)}</div></div>
        <div><div class="lp-meta-lbl">CTR</div><div class="lp-meta-val">${PCT(ctr)}</div></div>
        <div><div class="lp-meta-lbl">CPM</div><div class="lp-meta-val">${BRL(cpm)}</div></div>
      </div></div>`;
      // Detalhe por criativo
      const by={};
      for(const r of rows){ const k=r.anuncio||'—'; const o=by[k]||(by[k]={k, camp:r.campanha, link:'', inv:0, imp:0, clk:0}); o.inv+=(r.cost||0); o.imp+=(r.impressions||0); o.clk+=(r.clicks||0); if(!o.link&&r.link)o.link=r.link; }
      let list=Object.values(by).map(o=>Object.assign(o,{ctr:div(o.clk,o.imp)*100, cpc:div(o.inv,o.clk)})).sort((a,b)=>b.inv-a.inv);
      h+=`<div class="lbl">Criativos (${list.length})</div><div class="twrap"><table><thead><tr>
        <th style="text-align:left">Criativo</th><th style="text-align:left">Campanha</th><th>Investido</th><th>Impr.</th><th>CTR</th><th>Cliques</th><th>CPC</th><th>Link</th>
      </tr></thead><tbody>`;
      for(const o of list){
        h+=`<tr><td title="${o.k}">${o.k}</td><td title="${o.camp}">${o.camp}</td><td>${BRL(o.inv)}</td><td>${NUM(o.imp)}</td><td>${PCT(o.ctr)}</td><td>${NUM(o.clk)}</td><td>${o.clk?BRL(o.cpc):'—'}</td><td>${o.link?`<a class="vlink" href="${o.link}" target="_blank">abrir</a>`:'—'}</td></tr>`;
      }
      h+=`</tbody></table></div>`;
      document.getElementById('body').innerHTML=h;
      upd();
    }

    async function loadAll(){
      document.getElementById('body').innerHTML='<div class="loading">Carregando dados da planilha…</div>';
      try{
        const UTMQ="gid=0&tq="+encodeURIComponent("select * where A >= date '2026-10-23'");
        const [tMalu,tHire,tMetas,tuMalu,tuHire,tMetr,tVendas]=await Promise.all([
          gviz(FONTE,'sheet='+encodeURIComponent('Malu Meta')),
          gviz(FONTE,'sheet='+encodeURIComponent('Hire Meta')),
          gviz(FONTE,'sheet='+encodeURIComponent('Metas')).catch(()=>null),
          (UTM_MALU?gviz(UTM_MALU,UTMQ):Promise.resolve(null)).catch(()=>null),
          (UTM_HIRE?gviz(UTM_HIRE,UTMQ):Promise.resolve(null)).catch(()=>null),
          gviz(ADS_WB,'gid='+GID_METRICAS).catch(()=>null),
          gviz(FONTE,'sheet='+encodeURIComponent('Vendas')).catch(()=>null),
        ]);
        DATA.malu=metaRows(tMalu); DATA.hire=metaRows(tHire);
        DATA.umalu=tuMalu?utmRows(tuMalu):[]; DATA.uhire=tuHire?utmRows(tuHire):[];
        DATA.metas=tMetas?readMetas(tMetas):{...METAS_DEFAULT};
        DATA.metricas=tMetr?metricasParse(tMetr):null;
        DATA.vendas=tVendas?vendaRows(tVendas):[];
        // Cost vem em US$ (conta do Meta) → converte p/ R$ pela cotação (aba Metas ou 5,19)
        const cot = DATA.metas.cotacao || 5.19;
        DATA.malu.forEach(r=>{ r.cost *= cot; });
        DATA.hire.forEach(r=>{ r.cost *= cot; });
        // Só o Investimento é US$ (Meta); Faturamento/Valor Carrinho já vêm em R$ (checkout).
        DATA.vendas.forEach(r=>{ r.inv *= cot; });
        await loadOverrides();     // overrides manuais de status (servidor) antes de renderizar
        route();
        const _hp=(location.hash||'').replace('#','');   // abre a aba do #hash (deep-link)
        if(_hp){ const _tb=document.querySelector('.tab[data-p="'+_hp+'"]'); if(_tb) setTab(_tb); }
      }catch(e){
        document.getElementById('body').innerHTML='<div class="empty err">Erro ao carregar: '+e.message+'</div>';
      }
    }
    loadAll();
  </script>
</body>
</html>
